name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".agents/plugins/**"
      - "**/plugin.json"
      - "pstack/references/runtime/**"
      - "pstack/skills/**"
      - "pstack/README.md"
      - "pstack/docs/**"
      - "pstack/LICENSE"
      - "schemas/**"
      - "scripts/generate-codex-pstack.mjs"
      - "scripts/validate-codex-pstack.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Codex pstack compatibility
        run: node scripts/validate-codex-pstack.mjs

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs
